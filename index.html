<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveView — Self-Hosted Stream Player</title>

  <!--
    HLS.js v1.5.7 — supports Chrome 49+, Firefox 52+, Edge 14+
    Falls back to native HLS on Safari/iOS
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* Reset */
    * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080c14;
      --surface:  #0e1520;
      --border:   #1a2535;
      --cyan:     #00e5ff;
      --cyan-dim: #007a8c;
      --red:      #ff3d5a;
      --text:     #e2eaf5;
      --muted:    #4a6080;
      --font-ui:  'Space Grotesk', sans-serif;
      --font-mono:'JetBrains Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      overflow-x: hidden;
    }

    /* ── HEADER ─────────────────────────────────────── */
    header {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      -webkit-box-pack: justify;
      -ms-flex-pack: justify;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .wordmark {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .wordmark span { color: var(--text); }

    .header-right {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      gap: 16px;
    }

    /* LIVE badge */
    .live-badge {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      -webkit-transition: color 0.3s;
      transition: color 0.3s;
    }
    .live-badge.active { color: var(--red); }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      -webkit-transition: background 0.3s;
      transition: background 0.3s;
    }
    .live-badge.active .live-dot {
      background: var(--red);
      -webkit-animation: pulse 1.6s ease-in-out infinite;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @-webkit-keyframes pulse {
      0%, 100% { -webkit-box-shadow: 0 0 0 0 rgba(255,61,90,0.6); box-shadow: 0 0 0 0 rgba(255,61,90,0.6); }
      50%       { -webkit-box-shadow: 0 0 0 6px rgba(255,61,90,0); box-shadow: 0 0 0 6px rgba(255,61,90,0); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,61,90,0.6); }
      50%       { box-shadow: 0 0 0 6px rgba(255,61,90,0); }
    }

    .btn-settings {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      cursor: pointer;
      -webkit-transition: border-color 0.2s, color 0.2s;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-settings:hover { border-color: var(--cyan-dim); color: var(--cyan); }

    /* ── MAIN ───────────────────────────────────────── */
    main {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -ms-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      padding: 28px 20px 60px;
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── VIDEO STAGE ────────────────────────────────── */
    .video-stage {
      width: 100%;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      /* aspect-ratio fallback for old Chrome */
      padding-top: 56.25%;
      height: 0;
    }

    /* aspect-ratio supported (Chrome 88+) */
    @supports (aspect-ratio: 16/9) {
      .video-stage {
        padding-top: 0;
        height: auto;
        aspect-ratio: 16/9;
      }
    }

    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    /* fix video position when aspect-ratio is supported */
    @supports (aspect-ratio: 16/9) {
      video {
        position: static;
      }
    }

    .placeholder {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -ms-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      -webkit-box-pack: center;
      -ms-flex-pack: center;
      justify-content: center;
      gap: 12px;
      background: #000;
      -webkit-transition: opacity 0.3s;
      transition: opacity 0.3s;
      z-index: 2;
    }
    .placeholder.hidden { opacity: 0; pointer-events: none; }

    .placeholder-icon {
      width: 56px; height: 56px;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      -webkit-box-pack: center;
      -ms-flex-pack: center;
      justify-content: center;
    }
    .placeholder-icon svg { fill: var(--muted); }
    .placeholder p {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
    }

    /* scanline overlay */
    .video-stage::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ── STATUS BAR ─────────────────────────────────── */
    .status-bar {
      width: 100%;
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--muted);
      -ms-flex-wrap: wrap;
      flex-wrap: wrap;
    }
    .status-bar .sep { color: var(--border); -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
    .status-bar .tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 3px;
      background: var(--border);
      letter-spacing: 0.06em;
      color: var(--cyan);
    }

    /* ── URL DRAWER ─────────────────────────────────── */
    .url-drawer {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .drawer-header {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-align: center;
      -ms-flex-align: center;
      align-items: center;
      -webkit-box-pack: justify;
      -ms-flex-pack: justify;
      justify-content: space-between;
      padding: 14px 20px;
      cursor: pointer;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      border-bottom: 1px solid transparent;
      -webkit-transition: border-color 0.2s;
      transition: border-color 0.2s;
    }
    .drawer-header:hover { border-bottom-color: var(--border); }
    .drawer-title {
      font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted);
    }
    .drawer-arrow {
      -webkit-transition: -webkit-transform 0.3s;
      transition: transform 0.3s;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .url-drawer.open .drawer-arrow { -webkit-transform: rotate(180deg); transform: rotate(180deg); }
    .drawer-body { max-height: 0; overflow: hidden; -webkit-transition: max-height 0.35s ease; transition: max-height 0.35s ease; }
    .url-drawer.open .drawer-body { max-height: 320px; }
    .drawer-inner { padding: 20px; display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-orient: vertical; -webkit-box-direction: normal; -ms-flex-direction: column; flex-direction: column; gap: 14px; }

    .input-group { display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-orient: vertical; -webkit-box-direction: normal; -ms-flex-direction: column; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    .input-row { display: -webkit-box; display: -ms-flexbox; display: flex; gap: 10px; }

    input[type="text"] {
      -webkit-box-flex: 1;
      -ms-flex: 1;
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 10px 14px;
      outline: none;
      -webkit-transition: border-color 0.2s;
      transition: border-color 0.2s;
      /* old Chrome fix */
      -webkit-appearance: none;
    }
    input[type="text"]:focus { border-color: var(--cyan-dim); }
    input[type="text"]::-webkit-input-placeholder { color: var(--muted); }
    input[type="text"]::-moz-placeholder { color: var(--muted); }
    input[type="text"]:-ms-input-placeholder { color: var(--muted); }
    input[type="text"]::placeholder { color: var(--muted); }

    .btn-load {
      background: var(--cyan);
      color: #000;
      border: none;
      border-radius: 4px;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 20px;
      cursor: pointer;
      white-space: nowrap;
      -webkit-transition: opacity 0.2s;
      transition: opacity 0.2s;
    }
    .btn-load:hover { opacity: 0.85; }

    .hint { font-size: 0.72rem; color: var(--muted); line-height: 1.7; font-family: var(--font-mono); }
    .hint code { color: var(--cyan); background: rgba(0,229,255,0.07); padding: 1px 5px; border-radius: 3px; }

    /* ── TOAST ──────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      -webkit-transform: translateX(-50%) translateY(80px);
      transform: translateX(-50%) translateY(80px);
      background: #1c0a0f;
      border: 1px solid var(--red);
      color: var(--red);
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
      -webkit-transition: -webkit-transform 0.3s ease;
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { -webkit-transform: translateX(-50%) translateY(0); transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ─────────────────────────────────── */
    @media (max-width: 600px) {
      .input-row { -webkit-box-orient: vertical; -webkit-box-direction: normal; -ms-flex-direction: column; flex-direction: column; }
      .btn-load { width: 100%; }
      header { padding: 12px 16px; }
      main { padding: 16px 12px 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .live-dot { -webkit-animation: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

<header>
  <div class="wordmark">Live<span>View</span></div>
  <div class="header-right">
    <div class="live-badge" id="liveBadge">
      <div class="live-dot"></div>
      <span id="liveLabel">OFFLINE</span>
    </div>
    <button class="btn-settings" onclick="toggleDrawer()">Stream URL</button>
  </div>
</header>

<main>
  <div class="video-stage" id="videoStage">
    <video id="video" controls playsinline></video>
    <div class="placeholder" id="placeholder">
      <div class="placeholder-icon">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <p>Enter your stream URL below to start watching.</p>
    </div>
  </div>

  <div class="status-bar">
    <span class="tag">HLS</span>
    <span class="sep">|</span>
    <span id="statusText">No stream loaded</span>
    <span class="sep" id="urlSep" style="display:none">|</span>
    <span id="urlDisplay" style="font-size:0.7rem;word-break:break-all;"></span>
  </div>

  <div class="url-drawer" id="urlDrawer">
    <div class="drawer-header" onclick="toggleDrawer()">
      <span class="drawer-title">Stream Source</span>
      <span class="drawer-arrow">&#9660;</span>
    </div>
    <div class="drawer-body">
      <div class="drawer-inner">
        <div class="input-group">
          <label>HLS Stream URL (.m3u8)</label>
          <div class="input-row">
            <input
              type="text"
              id="streamUrl"
              placeholder="http://YOUR-IP:9000/live/index.m3u8"
              spellcheck="false"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
            />
            <button class="btn-load" onclick="loadStream()">Load</button>
          </div>
        </div>
        <div class="hint">
          Local network: <code>http://192.168.1.140:9000/live/index.m3u8</code><br/>
          Via Cloudflare: <code>https://your-tunnel.trycloudflare.com/live/index.m3u8</code>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────
  var hls = null;
  var currentUrl = null;

  // ── Init ───────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', function() {
    var saved = localStorage.getItem('liveview_url');
    if (saved) {
      document.getElementById('streamUrl').value = saved;
      loadStream();
    } else {
      openDrawer();
    }
    document.getElementById('streamUrl').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.keyCode === 13) loadStream();
    });
  });

  // ── Drawer ─────────────────────────────────────────
  function toggleDrawer() {
    document.getElementById('urlDrawer').classList.toggle('open');
  }
  function openDrawer() {
    document.getElementById('urlDrawer').classList.add('open');
  }

  // ── Load stream ────────────────────────────────────
  function loadStream() {
    var input = document.getElementById('streamUrl').value.trim();
    if (!input) { showToast('Please enter a stream URL.'); return; }
    currentUrl = input;
    localStorage.setItem('liveview_url', input);
    startStream(input);
  }

  // ── Core stream starter ────────────────────────────
  function startStream(url) {
    setStatus('Connecting\u2026', url);
    setLive(false);

    // Clean up existing HLS instance
    if (hls) {
      try { hls.destroy(); } catch(e) {}
      hls = null;
    }

    var video = document.getElementById('video');
    video.pause();
    try { video.src = ''; } catch(e) {}

    // ── Safari / iPhone — native HLS ───────────────
    if (video.canPlayType('application/vnd.apple.mpegurl') ||
        video.canPlayType('application/x-mpegurl')) {

      video.src = url;

      video.addEventListener('loadedmetadata', function onMeta() {
        video.removeEventListener('loadedmetadata', onMeta);
        hidePlaceholder();
        setLive(true);
        setStatus('Live', url);
        try { video.play(); } catch(e) {}
      });

      video.addEventListener('error', function onErr() {
        video.removeEventListener('error', onErr);
        setLive(false);
        setStatus('Stream error \u2014 check your URL', url);
      });

    // ── HLS.js — Chrome, Firefox, Edge, old browsers ─
    } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {

      hls = new Hls({
        // Maximum stability
        liveSyncDurationCount: 10,
        liveMaxLatencyDurationCount: 30,
        maxBufferLength: 600,
        maxMaxBufferLength: 600,
        maxBufferSize: 600 * 1000 * 1000,
        maxBufferHole: 5,
        lowLatencyMode: false,
        enableWorker: true,
        // Never timeout
        levelLoadingTimeout: 2147483647,
        fragLoadingTimeout: 2147483647,
        manifestLoadingTimeout: 2147483647,
        // Never stop retrying
        manifestLoadingMaxRetry: 2147483647,
        manifestLoadingRetryDelay: 3000,
        manifestLoadingMaxRetryTimeout: 2147483647,
        levelLoadingMaxRetry: 2147483647,
        levelLoadingRetryDelay: 3000,
        levelLoadingMaxRetryTimeout: 2147483647,
        fragLoadingMaxRetry: 2147483647,
        fragLoadingRetryDelay: 3000,
        fragLoadingMaxRetryTimeout: 2147483647,
        xhrSetup: function(xhr) {
          xhr.withCredentials = false;
          xhr.timeout = 0;
        }
      });

      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        hidePlaceholder();
        setStatus('Stream loaded\u2026', url);
        try { video.play(); } catch(e) {}
      });

      hls.on(Hls.Events.FRAG_LOADED, function() {
        setLive(true);
        setStatus('Live', url);
      });

      hls.on(Hls.Events.ERROR, function(event, data) {
        if (data.fatal) {
          setLive(false);
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            setStatus('Network error \u2014 retrying\u2026', url);
            try { hls.startLoad(); } catch(e) {}
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            setStatus('Media error \u2014 recovering\u2026', url);
            try { hls.recoverMediaError(); } catch(e) {}
          }
          // No auto-restart — HLS.js retries internally
        }
      });

    } else {
      // Absolute fallback — set src directly (works on some old browsers)
      video.src = url;
      video.addEventListener('canplay', function onPlay() {
        video.removeEventListener('canplay', onPlay);
        hidePlaceholder();
        setLive(true);
        setStatus('Live', url);
        try { video.play(); } catch(e) {}
      });
      showToast('Using basic playback mode');
    }
  }

  // ── UI helpers ─────────────────────────────────────
  function hidePlaceholder() {
    document.getElementById('placeholder').classList.add('hidden');
  }

  function setLive(active) {
    var badge = document.getElementById('liveBadge');
    var label = document.getElementById('liveLabel');
    if (active) {
      badge.className = 'live-badge active';
      label.textContent = 'LIVE';
    } else {
      badge.className = 'live-badge';
      label.textContent = currentUrl ? 'CONNECTING' : 'OFFLINE';
    }
  }

  function setStatus(msg, url) {
    document.getElementById('statusText').textContent = msg;
    if (url) {
      document.getElementById('urlSep').style.display = '';
      document.getElementById('urlDisplay').textContent = url;
    }
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show';
    setTimeout(function() { t.className = 'toast'; }, 3500);
  }
</script>
</body>
</html>
