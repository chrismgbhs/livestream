<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveView — Self-Hosted Stream Player</title>

  <!-- HLS.js for HLS stream playback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080c14;
      --surface:   #0e1520;
      --border:    #1a2535;
      --cyan:      #00e5ff;
      --cyan-dim:  #007a8c;
      --red:       #ff3d5a;
      --text:      #e2eaf5;
      --muted:     #4a6080;
      --font-ui:   'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      overflow-x: hidden;
    }

    /* ── TOP BAR ─────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .wordmark {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .wordmark span { color: var(--text); }

    /* LIVE badge */
    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.3s;
    }
    .live-badge.active { color: var(--red); }

    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .live-badge.active .live-dot {
      background: var(--red);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,61,90,0.6); }
      50%       { box-shadow: 0 0 0 6px rgba(255,61,90,0); }
    }

    /* header right side */
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-settings {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-settings:hover { border-color: var(--cyan-dim); color: var(--cyan); }

    /* ── MAIN LAYOUT ──────────────────────────────────── */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 60px;
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── VIDEO STAGE ──────────────────────────────────── */
    .video-stage {
      width: 100%;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16/9;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    /* Overlay when not playing */
    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #000;
      transition: opacity 0.3s;
    }
    .placeholder.hidden { opacity: 0; pointer-events: none; }

    .placeholder-icon {
      width: 56px; height: 56px;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .placeholder-icon svg { fill: var(--muted); }

    .placeholder p {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-align: center;
      max-width: 260px;
      line-height: 1.6;
    }

    /* scan-line ambient texture */
    .video-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
    }

    /* ── STATUS BAR ───────────────────────────────────── */
    .status-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--muted);
      flex-wrap: wrap;
    }

    .status-bar .sep {
      color: var(--border);
      user-select: none;
    }

    .status-bar .tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 3px;
      background: var(--border);
      letter-spacing: 0.06em;
    }
    .tag.hls  { color: var(--cyan); }
    .tag.rtmp { color: #ffa040; }

    /* ── URL DRAWER ───────────────────────────────────── */
    .url-drawer {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .drawer-header:hover { border-bottom-color: var(--border); }

    .drawer-title {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .drawer-arrow {
      transition: transform 0.3s;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .url-drawer.open .drawer-arrow { transform: rotate(180deg); }

    .drawer-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease;
    }
    .url-drawer.open .drawer-body {
      max-height: 300px;
    }

    .drawer-inner {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--cyan-dim); }
    input[type="text"]::placeholder { color: var(--muted); }

    .btn-load {
      background: var(--cyan);
      color: #000;
      border: none;
      border-radius: 4px;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .btn-load:hover { opacity: 0.85; }

    .hint {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.7;
      font-family: var(--font-mono);
    }
    .hint code {
      color: var(--cyan);
      background: rgba(0,229,255,0.07);
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* ── ERROR TOAST ──────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1c0a0f;
      border: 1px solid var(--red);
      color: var(--red);
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ───────────────────────────────────── */
    @media (max-width: 600px) {
      .input-row { flex-direction: column; }
      .btn-load { width: 100%; }
      header { padding: 12px 16px; }
      main { padding: 16px 12px 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none !important; }
    }
  </style>
</head>
<body>

<header>
  <div class="wordmark">Live<span>View</span></div>
  <div class="header-right">
    <div class="live-badge" id="liveBadge">
      <div class="live-dot"></div>
      <span id="liveLabel">OFFLINE</span>
    </div>
    <button class="btn-settings" onclick="toggleDrawer()">Stream URL</button>
  </div>
</header>

<main>

  <!-- VIDEO PLAYER -->
  <div class="video-stage">
    <video id="video" controls playsinline></video>
    <div class="placeholder" id="placeholder">
      <div class="placeholder-icon">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
      <p>Enter your HLS stream URL below to start watching.</p>
    </div>
  </div>

  <!-- STATUS ROW -->
  <div class="status-bar" id="statusBar">
    <span class="tag hls">HLS</span>
    <span class="sep">|</span>
    <span id="statusText">No stream loaded</span>
    <span class="sep" id="urlDisplay" style="display:none">|</span>
    <span id="urlDisplay2" style="font-size:0.7rem; word-break:break-all;"></span>
  </div>

  <!-- URL DRAWER -->
  <div class="url-drawer" id="urlDrawer">
    <div class="drawer-header" onclick="toggleDrawer()">
      <span class="drawer-title">Stream Source</span>
      <span class="drawer-arrow">▼</span>
    </div>
    <div class="drawer-body">
      <div class="drawer-inner">
        <div class="input-group">
          <label>HLS Stream URL (.m3u8)</label>
          <div class="input-row">
            <input
              type="text"
              id="streamUrl"
              placeholder="http://YOUR-IP:8080/hls/stream.m3u8"
              spellcheck="false"
            />
            <button class="btn-load" onclick="loadStream()">Load</button>
          </div>
        </div>
        <div class="hint">
          Point this at your NGINX-RTMP HLS output, e.g.
          <code>http://192.168.1.x:8080/hls/live.m3u8</code><br/>
          For public streams via ngrok:
          <code>https://xxxx.ngrok.io/hls/live.m3u8</code>
        </div>
      </div>
    </div>
  </div>

</main>

<!-- ERROR TOAST -->
<div class="toast" id="toast"></div>

<script>
  let hls = null;

  // ── Open drawer by default if no URL ──────────────
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('liveview_url');
    if (saved) {
      document.getElementById('streamUrl').value = saved;
      loadStream();
    } else {
      openDrawer();
    }

    // Load on Enter key
    document.getElementById('streamUrl').addEventListener('keydown', e => {
      if (e.key === 'Enter') loadStream();
    });
  });

  // ── Drawer ─────────────────────────────────────────
  function toggleDrawer() {
    document.getElementById('urlDrawer').classList.toggle('open');
  }
  function openDrawer() {
    document.getElementById('urlDrawer').classList.add('open');
  }

  // ── Load stream ────────────────────────────────────
  function loadStream() {
    const input = document.getElementById('streamUrl').value.trim();
    if (!input) { showToast('Please enter a stream URL.'); return; }

    const url = input;
    localStorage.setItem('liveview_url', url);
    setStatus('Connecting…', url);

    if (hls) { hls.destroy(); hls = null; }

    const video = document.getElementById('video');

    if (Hls.isSupported()) {
      hls = new Hls({
        liveSyncDurationCount: 3,
        liveMaxLatencyDurationCount: 6,
        maxBufferLength: 10,
      });

      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        hidePlaceholder();
        setStatus('Stream loaded — waiting for data…', url);
        video.play().catch(() => {});
      });

      hls.on(Hls.Events.FRAG_LOADED, () => {
        setLive(true);
        setStatus('Live', url);
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          setLive(false);
          setStatus('Stream error — check your URL or server', url);
          showToast('Fatal stream error: ' + data.type);
        }
      });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari native HLS
      video.src = url;
      video.addEventListener('loadedmetadata', () => {
        hidePlaceholder();
        setLive(true);
        setStatus('Live (native HLS)', url);
        video.play().catch(() => {});
      }, { once: true });
      video.addEventListener('error', () => {
        setLive(false);
        setStatus('Could not load stream', url);
        showToast('Stream failed to load.');
      }, { once: true });

    } else {
      showToast('HLS is not supported in this browser.');
    }
  }

  // ── UI helpers ─────────────────────────────────────
  function hidePlaceholder() {
    document.getElementById('placeholder').classList.add('hidden');
  }

  function setLive(active) {
    const badge = document.getElementById('liveBadge');
    const label = document.getElementById('liveLabel');
    badge.classList.toggle('active', active);
    label.textContent = active ? 'LIVE' : 'CONNECTING';
  }

  function setStatus(msg, url) {
    document.getElementById('statusText').textContent = msg;
    if (url) {
      document.getElementById('urlDisplay').style.display = '';
      document.getElementById('urlDisplay2').textContent = url;
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>
</body>
</html>
